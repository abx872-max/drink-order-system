<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>飲料團購系統</title>

<style>

:root{
    --primary:#2563EB;
    --background:#F8FAFC;
    --card:#FFFFFF;
    --text:#0F172A;
    --subtext:#64748B;
    --border:#E2E8F0;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--background);
    font-family:"Microsoft JhengHei",sans-serif;
    color:var(--text);
}

.header{
    background:linear-gradient(
        135deg,
        #2563EB,
        #3B82F6
    );
    color:white;
    padding:24px 24px;
    text-align:center;
}

.header-icon{
    font-size:48px;
    margin-bottom:10px;
}

.header-title{
    font-size:30px;
    font-weight:bold;
}

.header-subtitle{
    margin-top:10px;
    opacity:.9;
}

.container{
    max-width:520px;
    margin:-20px auto 40px;
    padding:16px;
}

.event-card{
    background:white;
    border-radius:20px;
    padding:24px;
    box-shadow:
        0 10px 30px rgba(0,0,0,.08);
}

.badge{
    display:inline-block;
    background:#DBEAFE;
    color:#2563EB;
    padding:6px 12px;
    border-radius:999px;
    font-size:14px;
    font-weight:bold;
}

.event-title{
    margin-top:14px;
    font-size:28px;
    font-weight:bold;
}

.shop{
    margin-top:10px;
    color:var(--subtext);
    font-size:16px;
}

.deadline{
    margin-top:12px;
    color:#DC2626;
    font-weight:bold;
}

.order-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#0F172A;
    color:white;
    padding:16px;
    border-radius:14px;
    margin-top:22px;
    font-size:18px;
    font-weight:bold;
}

.quick-area{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

.quick-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    text-align:center;
    background:#FAFAFA;

    transition:.2s;
    cursor:pointer;
}

.quick-card .icon{
    font-size:28px;
}

.quick-card .title{
    margin-top:8px;
    font-weight:bold;
}

.section-title{
    margin:28px 4px 14px;
    font-size:20px;
    font-weight:bold;
}

.category-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:18px;
    border-radius:16px;
    margin-bottom:12px;
    text-decoration:none;
    color:var(--text);
    box-shadow:0 2px 8px rgba(0,0,0,.05);

    transition:.2s;
    cursor:pointer;
}

.category-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.category-icon{
    font-size:28px;
}

.category-title{
    font-size:18px;
    font-weight:bold;
}

.category-count{
    font-size:13px;
    color:var(--subtext);
}

.arrow{
    color:#94A3B8;
    font-size:20px;
}

.footer{
    text-align:center;
    margin-top:24px;
    color:#94A3B8;
    font-size:12px;
}

/* 滑鼠移入效果 */

.category-card:hover{
    transform:translateY(-2px);
}

.quick-card:hover{
    transform:translateY(-2px);
}

.order-btn:hover{
    opacity:.9;
}

</style>

</head>

<body>

<div class="header">

    <div class="header-icon">
        🥤
    </div>

    <div class="header-title">
        飲料團購系統
    </div>

  
</div>

<div class="container">

    <div class="event-card">

        <div class="badge">
            🎉 活動進行中
        </div>

        <div class="event-title">
            王經理請飲料
        </div>

        <div class="shop">
            店家：得正
        </div>

        <div class="deadline">
            ⏰ 截止時間：2026/10/22 14:30
        </div>


        <div class="quick-area">

<a href="menu-photo.html"
   class="quick-card">

    <div class="icon">📷</div>

    <div class="title">查看菜單</div>

</a>

           <a href="missing-item.html"
   class="quick-card">
                <div class="icon">❓</div>
                <div class="title">缺漏回報</div>
            </a>

        </div>

    </div>

    <div class="section-title">
        商品分類
    </div>

    <a href="milk-tea.html" class="category-card">
        <div class="category-left">
            <div class="category-icon">🧋</div>
            <div>
                <div class="category-title">
                    奶茶類
                </div>
                <div class="category-count">
                    12 項商品
                </div>
            </div>
        </div>
        <div class="arrow">›</div>
    </a>

    <a href="#" class="category-card">
        <div class="category-left">
            <div class="category-icon">🍵</div>
            <div>
                <div class="category-title">
                    茶類
                </div>
                <div class="category-count">
                    18 項商品
                </div>
            </div>
        </div>
        <div class="arrow">›</div>
    </a>

    <a href="#" class="category-card">
        <div class="category-left">
            <div class="category-icon">🥛</div>
            <div>
                <div class="category-title">
                    鮮奶類
                </div>
                <div class="category-count">
                    9 項商品
                </div>
            </div>
        </div>
        <div class="arrow">›</div>
    </a>

    <a href="#" class="category-card">
        <div class="category-left">
            <div class="category-icon">🍋</div>
            <div>
                <div class="category-title">
                    水果類
                </div>
                <div class="category-count">
                    15 項商品
                </div>
            </div>
        </div>
        <div class="arrow">›</div>
    </a>

    <a href="#" class="category-card">
        <div class="category-left">
            <div class="category-icon">🍮</div>
            <div>
                <div class="category-title">
                    豆花類
                </div>
                <div class="category-count">
                    6 項商品
                </div>
            </div>
        </div>
        <div class="arrow">›</div>
    </a>

    <div class="footer">
        Drink Order System V1
    </div>

</div>

</body>
</html>
