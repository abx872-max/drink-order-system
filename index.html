<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>飲料團購系統</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Microsoft JhengHei",sans-serif;
    background:#F8FAFC;
    color:#1E293B;
}

.header{
    background:#2563EB;
    color:white;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:480px;
    margin:auto;
    padding:16px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
    margin-bottom:16px;
}

.event-title{
    font-size:24px;
    font-weight:bold;
}

.shop{
    color:#475569;
    margin-top:12px;
}

.deadline{
    color:#DC2626;
    margin-top:8px;
}

.button{
    display:block;
    width:100%;
    background:#2563EB;
    color:white;
    text-decoration:none;
    text-align:center;
    padding:14px;
    border-radius:10px;
    margin-top:18px;
    font-weight:bold;
}

.quick-link{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.quick-link div{
    flex:1;
    background:#F1F5F9;
    padding:12px;
    border-radius:10px;
    text-align:center;
}

.category{
    background:white;
    border-radius:14px;
    padding:14px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
    font-size:18px;
}

.footer{
    text-align:center;
    color:#94A3B8;
    font-size:12px;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="header">
🥤 飲料團購系統
</div>

<div class="container">

<div class="card">

<div class="event-title">
🎉 王經理請飲料
</div>

<div class="shop">
店家：得正
</div>

<div class="deadline">
截止時間：2026/10/22 14:30
</div>

<a href="order.html" class="button">
我要點餐
</a>

<div class="quick-link">

<div>
📷<br>
查看菜單
</div>

<div>
❓<br>
缺漏回報
</div>

</div>

</div>

<div class="category">
🧋 奶茶類
</div>

<div class="category">
🍵 茶類
</div>

<div class="category">
🥛 鮮奶類
</div>

<div class="category">
🍋 水果類
</div>

<div class="category">
🍮 豆花類
</div>

<div class="footer">
Drink Order System V1 Prototype
</div>

</div>

</body>

</html>
