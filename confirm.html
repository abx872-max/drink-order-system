<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>訂單確認</title>

<style>

body{
    margin:0;
    background:#F8FAFC;
    font-family:"Microsoft JhengHei",sans-serif;
}

.header{
    background:#2563EB;
    color:white;
    text-align:center;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:520px;
    margin:auto;
    padding:16px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.row{
    margin-bottom:15px;
}

.label{
    color:#64748B;
    font-size:14px;
}

.value{
    font-size:18px;
    font-weight:bold;
    margin-top:4px;
}

.confirm-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:16px;
    background:#0F172A;
    color:white;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">
📝 訂單確認
</div>

<div class="container">

<div class="card">

<div class="row">
<div class="label">工號</div>
<div class="value">A12345</div>
</div>

<div class="row">
<div class="label">商品</div>
<div class="value">珍珠奶茶</div>
</div>

<div class="row">
<div class="label">甜度</div>
<div class="value">半糖</div>
</div>

<div class="row">
<div class="label">冰量</div>
<div class="value">少冰</div>
</div>

<div class="row">
<div class="label">加料</div>
<div class="value">椰果</div>
</div>

<div class="row">
<div class="label">金額</div>
<div class="value">NT$75</div>
</div>

</div>

<a href="success.html">

<button class="confirm-btn">
確認送出
</button>

</a>


</div>

</body>
</html>
