<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>找不到品項</title>

<style>

body{
    margin:0;
    background:#F8FAFC;
    font-family:"Microsoft JhengHei",sans-serif;
}

.header{
    background:#2563EB;
    color:white;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

.back-link{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

.container{
    max-width:520px;
    margin:auto;
    padding:16px;
}

.card{
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:10px;
}

.desc{
    color:#64748B;
    margin-bottom:20px;
}

.label{
    font-weight:bold;
    margin-bottom:8px;
}

.input{
    width:100%;
    padding:12px;
    border:1px solid #CBD5E1;
    border-radius:10px;
    font-size:16px;
    margin-bottom:16px;
    box-sizing:border-box;
}

.textarea{
    width:100%;
    min-height:120px;
    padding:12px;
    border:1px solid #CBD5E1;
    border-radius:10px;
    font-size:16px;
    box-sizing:border-box;
}

.submit-btn{
    width:100%;
    margin-top:20px;
    border:none;
    background:#0F172A;
    color:white;
    padding:16px;
    border-radius:14px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<a href="index.html" class="back-link">
← 返回
</a>

</div>

<div class="container">

<div class="card">

<div class="title">
❓ 找不到品項？
</div>

<div class="desc">
如果菜單中找不到您想要的商品，
請協助填寫回報資訊。
</div>

<div class="label">
商品名稱
</div>

<input
class="input"
placeholder="例如：葡萄柚綠茶">

<div class="label">
備註
</div>

<textarea
class="textarea"
placeholder="例如：菜單照片中有，但系統內沒有看到">
</textarea>

<button class="submit-btn">
送出回報
</button>

</div>

</div>

</body>
</html>
