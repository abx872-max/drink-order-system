<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>奶茶類</title>

<style>

body{
    margin:0;
    background:#F8FAFC;

}

.header{
    background:#2563EB;
    color:white;
    padding:20px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    max-width:520px;
    margin:auto;
    padding:16px;
}

.item-card{
    display:flex;
    justify-content:space-between;
    align-items:center;

    background:white;

    padding:18px;

    margin-bottom:12px;

    border-radius:16px;

    text-decoration:none;

    color:#0F172A;

    box-shadow:0 2px 8px rgba(0,0,0,.05);

    transition:.2s;
}

.item-card:hover{
    transform:translateY(-2px);
}

.item-name{
    font-size:18px;
    font-weight:bold;
}

.item-price{
    color:#2563EB;
    margin-top:6px;
}

.arrow{
    color:#94A3B8;
    font-size:22px;
}

</style>

</head>

<body>

<div class="header">
🧋 奶茶類

<div class="container">

            珍珠奶茶
        </div>

        </div>

    </div>

    <div class="arrow">
        ›
    </div>

</a>

<a href="#" class="item-card">

    <div>

</a>

<a href="#" class="item-card">
