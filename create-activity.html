<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>建立活動</title>

<style>

body{
    margin:0;
    background:#F8FAFC;
    font-family:"Microsoft JhengHei",sans-serif;
}

.header{
    background:#2563EB;
    color:white;
    padding:20px;
}

.back-link{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:bold;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:24px;
    border-radius:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:24px;
}

.label{
    display:block;
    font-weight:bold;
    margin-bottom:8px;
    margin-top:16px;
}

.input,
.select{
    width:100%;
    padding:12px;
    border:1px solid #CBD5E1;
    border-radius:10px;
    box-sizing:border-box;
    font-size:16px;
}

.button{
    width:100%;
    margin-top:24px;
    border:none;
    background:#0F172A;
    color:white;
    padding:16px;
    border-radius:14px;
    font-size:18px;
    cursor:pointer;
}

</style>

</head>

<body>

<div class="header">

<a href="activity-management.html"
   class="back-link">

← 返回

</a>

</div>

<div class="container">

<div class="card">

<div class="title">
🎉 建立新活動
</div>

<label class="label">
活動名稱
</label>

<input
class="input"
placeholder="例如：王經理請飲料">

<label class="label">
選擇店家
</label>

<select class="select">

<option>
得正
</option>

<option>
清心福全
</option>

<option>
五十嵐
</option>

<option>
小南豆花
</option>

</select>

<label class="label">
截止日期
</label>

<input
type="date"
class="input">

<label class="label">
截止時間
</label>

<input
type="time"
class="input">

<label class="label">
主辦人
</label>

<input
class="input"
placeholder="例如：D">

<button class="button">

建立活動

</button>

</div>

</div>

</body>

</html>
